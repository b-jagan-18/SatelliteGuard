name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e .

      - name: Lint
        run: ruff check src tests app scripts

      - name: Cache raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: zenodo-15108715-v2

      - name: Download and verify data
        run: python -m satelliteguard.data.download

      - name: Data contract
        run: python -m satelliteguard.data.validate

      - name: Rebuild segment index (episodes)
        run: python -m satelliteguard.data.episodes

      - name: Tests
        run: pytest -q
